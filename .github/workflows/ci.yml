name: validation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare dataset and verify artifacts
        run: |
          mkdir -p data/raw
          cp Crop_recommendation.csv data/raw/Crop_recommendation.csv
          python -m backend.ml.train --dataset data/raw/Crop_recommendation.csv --artifacts-dir backend/artifacts --quick --promote
          python -m backend.ml.fertilizer --verify
      - name: Code quality check
        run: ruff check backend tests
      - name: Run test suite
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run test
      - run: npm run build
