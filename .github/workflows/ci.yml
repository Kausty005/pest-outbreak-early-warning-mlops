name: AgriAdapt CI/CD MLOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-lint:
    name: Code Quality & Security Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
      - name: Ruff Format & Lint Check
        run: ruff check backend src tests
      - name: Security Vulnerability Scan (Bandit)
        run: bandit -r backend/ src/ -ll -x tests/ || true

  ml-validation-and-backend-tests:
    name: Backend API & ML Validation Suite
    runs-on: ubuntu-latest
    needs: code-quality-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify MLOps Metrics Endpoint
        run: |
          python -c "import prometheus_client; from backend.app.core.metrics import prediction_requests_total; print('Prometheus client OK')"
      - name: Run Pytest Test Suite
        run: pytest -v --tb=short tests/

  frontend-build-and-test:
    name: Frontend Build & Test Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install Node Modules
        run: npm ci || npm install
      - name: Run Vitest Unit Tests
        run: npm run test
      - name: Production Bundle Build
        run: npm run build

  container-build-verification:
    name: Docker Container & Service Compose Verification
    runs-on: ubuntu-latest
    needs: [ml-validation-and-backend-tests, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose config
      - name: Validate Prometheus Configuration
        run: |
          docker run --rm -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus:v2.51.0 check config /etc/prometheus/prometheus.yml
