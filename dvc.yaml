stages:
  train_crop_model:
    cmd: python -m backend.ml.train --dataset data/raw/Crop_recommendation.csv --artifacts-dir backend/artifacts --promote
    deps:
      - data/raw/Crop_recommendation.csv
      - backend/ml/data_validation.py
      - backend/ml/feature_engineering.py
      - backend/ml/evaluate.py
      - backend/ml/train.py
      - backend/ml/model_registry.py
    outs:
      - backend/artifacts/crop_model.joblib
      - backend/artifacts/metadata.json
      - backend/artifacts/evaluation_report.md

  fertilizer_artifacts:
    cmd: python -m backend.ml.fertilizer --verify
    deps:
      - models/fertilizer_model.joblib
      - models/fertilizer_model_metadata.json
      - models/fertilizer_feature_schema.json
      - backend/ml/fertilizer.py
    outs:
      - backend/artifacts/fertilizer_verification.json:
          cache: false

  monitor_drift:
    cmd: python -m backend.ml.drift_monitor --reference data/raw/Crop_recommendation.csv --prediction-log logs/prediction_log.jsonl --report-dir logs/drift --synthetic
    deps:
      - data/raw/Crop_recommendation.csv
      - backend/ml/drift_monitor.py
    outs:
      - logs/drift:
          persist: true

  ingest_environmental_data:
    cmd: python run_data_ingestion.py --districts Nagpur Amravati Yavatmal Jalgaon --start-date 2023-06-01 --end-date 2023-10-31
    deps:
      - src/data_ingestion/weather_ingestion.py
      - src/data_ingestion/soil_moisture_ingestion.py
      - src/data_ingestion/pest_surveillance_ingestion.py
      - src/data_ingestion/data_validation.py
      - src/data_ingestion/data_alignment.py
      - run_data_ingestion.py
    outs:
      - data/raw/weather:
          persist: true
      - data/raw/soil:
          persist: true
      - data/processed/aligned_environmental_surveillance_2023-06-01_2023-10-31.csv:
          persist: true

  train_pest_forecasting_v2:
    cmd: python -m src.pest_forecasting.train_v2 --dataset data/experimental/synthetic_pest_forecasting_v2.csv --models-dir models/experimental_synthetic_pest_v2 --register-candidate --promote-experimental --mlflow --mlflow-experiment pest-forecasting-v2
    deps:
      - data/experimental/synthetic_pest_forecasting_v2.csv
      - src/pest_forecasting/dataset_v2.py
      - src/pest_forecasting/preprocessor_v2.py
      - src/pest_forecasting/evaluate.py
      - src/pest_forecasting/train_v2.py
      - backend/ml/model_registry.py
    outs:
      - models/experimental_synthetic_pest_v2/environmental_model_pipeline.joblib:
          cache: false
      - models/experimental_synthetic_pest_v2/full_model_pipeline.joblib:
          cache: false
      - models/experimental_synthetic_pest_v2/feature_schemas.json:
          cache: false
      - models/experimental_synthetic_pest_v2/model_config.json:
          cache: false
      - models/experimental_synthetic_pest_v2/partition_metadata.json:
          cache: false
      - models/experimental_synthetic_pest_v2/synthetic_provenance_metadata.json:
          cache: false
      - models/experimental_synthetic_pest_v2/stress_test_results.json:
          cache: false
      - models/experimental_synthetic_pest_v2/experiment_comparison_summary.json:
          cache: false
      - models/experimental_synthetic_pest_v2/inference_examples.json:
          cache: false
