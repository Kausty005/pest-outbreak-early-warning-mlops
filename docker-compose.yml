services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_ARTIFACT_DIR: /app/backend/artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crop:crop@db:5432/crop_advisory}
    volumes:
      - ./backend/artifacts:/app/backend/artifacts
      - ./models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    profiles: ["persistence"]
    environment:
      POSTGRES_DB: crop_advisory
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: crop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    build: .
    profiles: ["mlflow"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlruns/mlflow.db --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns

volumes:
  postgres_data:
