services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_ARTIFACT_DIR: /app/backend/artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crop:crop@db:5432/crop_advisory}
    volumes:
      - ./backend/artifacts:/app/backend/artifacts
      - ./models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    profiles: ["persistence"]
    environment:
      POSTGRES_DB: crop_advisory
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: crop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    build: .
    profiles: ["mlflow"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlruns/mlflow.db --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: agri_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: agri_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=agri2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
